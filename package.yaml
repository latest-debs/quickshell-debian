# Package definition for quickshell (SOURCE BUILD — first of its kind in this org)
#
# Upstream publishes NO Linux binaries, only source:
#   https://git.outfoxxed.me/quickshell/quickshell
# Mirror (for version detection only): https://github.com/quickshell-mirror/quickshell
#
# Built by debian-multiarch-builder's build_mode: source (compile in
# debian:<suite>, wrap with dpkg-deb). The trixie wayland-protocols overlay is
# expressed as a per-suite apt override below.

package_name: quickshell
github_repo: quickshell-mirror/quickshell
# Canonical upstream is Forgejo; GitHub is a mirror used for tag detection.
upstream_url: https://git.outfoxxed.me/quickshell/quickshell
upstream_ref: "v0.3.1"
artifact_format: source
build_mode: source
description: "Flexible QtQuick based desktop shell toolkit."
license: LGPL-3.0

# Debian parity exception (guard, not a current blocker): Debian only has
# 0.3.0-1 (forky/sid — rolling, advisory; trixie-backports 0.3.0-1~bpo13+1),
# so we are ahead of every released suite. The exception suppresses the
# RETIRE hard-stop if a released suite (trixie) ever reaches >= our upstream,
# keeping the pilot available for Ubuntu LTS/backports coverage.
# See apt-repo/parity-exceptions.json.
parity_exception: true

# Source-build matrix. Triage: bookworm Qt6 (6.4) is too old for quickshell
# (>=6.6 private headers); bullseye has no Qt6 at all. Start with trixie+,
# widen only if the build proves green.
build_suites:
  - trixie
  - forky
  - sid
skip_suites:
  - bullseye
  - bookworm

# Derived from upstream BUILD.md + each find_package/pkg_check_modules in the
# tree. Crash handler disabled (-DCRASH_HANDLER=OFF) so cpptrace is not needed.
build_depends:
  - build-essential
  - cmake
  - ninja-build
  - pkg-config
  - dpkg-dev
  - lintian
  - qt6-base-dev
  - qt6-base-private-dev
  - qt6-declarative-dev
  - qt6-declarative-private-dev
  - qt6-shadertools-dev
  - qt6-svg-dev
  - qt6-wayland-dev
  - qt6-wayland-private-dev
  - libdrm-dev
  - libgbm-dev
  - libegl-dev
  - libglib2.0-dev
  - libcli11-dev
  - libvulkan-dev
  - libxcb1-dev
  - libwayland-dev
  - libwayland-bin
  - wayland-protocols
  - libpipewire-0.3-dev
  - libpam0g-dev
  - libpolkit-agent-1-dev
  - libpolkit-gobject-1-dev
  - libjemalloc-dev
  - spirv-tools

cmake_flags:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCRASH_HANDLER=OFF

# trixie's wayland-protocols (1.44) predates staging/ext-background-effect-v1,
# which the background_effect module requires unconditionally. The package is
# Architecture: all (build-time protocol XML), so installing forky's copy with
# `-t forky` is side-effect-free; forky/sid already ship it.
build_apt_sources:
  forky:
    - "deb http://deb.debian.org/debian forky main"
build_depends_suites:
  trixie:
    from: forky
    packages:
      - wayland-protocols

# Only amd64/arm64 for the pilot; Qt+Wayland exotic-arch builds are unproven.
architectures:
  - amd64
  - arm64

smoke_skip: ""
